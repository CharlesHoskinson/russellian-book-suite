name: Setup Book Python
description: Install Python, cache pip, and install a skill's [ci] extras.

inputs:
  python-version:
    description: Python version to install (e.g. "3.13")
    required: true
  skill-path:
    description: Relative path to the skill directory (e.g. skills/book-qa)
    required: true
  extra:
    description: Optional-dependency extra to install (default "ci")
    required: false
    default: ci
  constraints:
    description: >
      Optional path to a pip constraints file (relative to repo root). When
      set, the skill install is pinned with `-c <file>` for reproducible
      transitive versions (P2-pip-lockfiles pilot). Empty = unconstrained.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.skill-path }}/pyproject.toml
    - name: install ${{ inputs.skill-path }}[${{ inputs.extra }}]
      shell: bash
      # Pin pip itself so the resolver/installer behaviour is reproducible
      # across runs (P2-pip-lockfiles). When a constraints file is provided
      # the editable install is pinned with `-c` for byte-identical transitive
      # versions.
      run: |
        python -m pip install --upgrade "pip==25.2"
        # An empty `extra` installs the base package with no optional-deps
        # bracket (some skills, e.g. the smoke-only matrix legs, have no `ci`
        # extra). A non-empty `extra` appends the `[extra]` selector.
        target="${{ inputs.skill-path }}"
        if [ -n "${{ inputs.extra }}" ] && [ "${{ inputs.extra }}" != "none" ]; then
          target="${target}[${{ inputs.extra }}]"
        fi
        if [ -n "${{ inputs.constraints }}" ]; then
          python -m pip install -e "${target}" -c "${{ inputs.constraints }}"
        else
          python -m pip install -e "${target}"
        fi
