name: BookLogic CLJS integration

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'skills/neurosym-forge/**'
      - 'verifiers/**'
      - '.github/workflows/booklogic-cljs-test.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cljs-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        # No cache directive: the only package.json in this repo lives in
        # scaffolded test fixtures, not at repo root, so cache: npm has
        # nothing to anchor on. nbb installs in ~30s; caching is YAGNI.
      - name: Install neurosym-forge in editable mode
        run: |
          cd skills/neurosym-forge
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Run live nbb integration test
        run: |
          cd skills/neurosym-forge
          .venv/bin/python -m pytest tests/test_cljs_integration.py -v

  booklogic-template-cargo-check:
    # REQ-VERIFIER-BUILD-022: cargo check --features smt and --features kg
    # against a fresh scaffolded project. Uses system Z3 (apt libz3-dev)
    # to avoid the 10-min bundled C++ build; Cozo still bundles but is
    # cached by Swatinem/rust-cache between runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system Z3
        # Skips the bundled-Z3 C++ build (~10 min) — z3-rs links to libz3.so
        # when the `bundled` feature is absent.
        run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - name: Install neurosym-forge in editable mode
        run: |
          cd skills/neurosym-forge
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Scaffold smoke project
        run: |
          cd skills/neurosym-forge
          .venv/bin/python -m scripts.scaffold_project \
            --name "CI-Smoke" --slug ci_smoke \
            --out /tmp/ci_smoke
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: /tmp/ci_smoke/rust-verifier
          # Cache key hash on Cargo.toml.tmpl + codegen scripts so a
          # template-shape change busts cleanly.
          shared-key: booklogic-template-cargo-check
      - name: Install npm deps in smoke project
        run: |
          cd /tmp/ci_smoke
          npm install --no-audit --no-fund --loglevel=error
      - name: Write defconstraint + defquery fixtures
        run: |
          echo '{:forms [(defconstraint C001 :backend :z3 :assert (= (:parishes-count :Bermuda) 9) :track :claim/id :on-unsat {:defect :D13 :severity :critical :message "test"})]}' \
            > /tmp/ci_smoke/rules/booklogic/constraints.edn
          echo '{:forms [(defquery Q001 :backend :cozo :find [(claim)] :where [(claim/load-bearing (claim) true)] :on-result {:defect :posterior-floor :severity :warning})]}' \
            > /tmp/ci_smoke/rules/booklogic/queries.edn
      - name: Run booklogic-compile + codegen
        run: |
          cd /tmp/ci_smoke
          npm run booklogic-compile
          npm run codegen-axioms
          npm run codegen-kg
      - name: cargo check --features smt
        # REQ-VERIFIER-BUILD-011: smt feature must compile cleanly.
        run: |
          cargo check \
            --manifest-path /tmp/ci_smoke/rust-verifier/Cargo.toml \
            --features smt
      - name: cargo check --features kg
        # REQ-VERIFIER-BUILD-021: kg feature must compile cleanly.
        run: |
          cargo check \
            --manifest-path /tmp/ci_smoke/rust-verifier/Cargo.toml \
            --features kg
