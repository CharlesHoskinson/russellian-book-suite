name: ci-budget
on:
  pull_request:
    types: [labeled, opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  budget-check:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-budget') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: compute last-20 turnaround stats
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: duration is updatedAt-createdAt, i.e. *turnaround* time
        # (queue/concurrency-wait included), not pure runner execution time.
        # The GitHub run-list API does not expose run_started_at here, so the
        # metric is labeled "turnaround" rather than "wall-time" to keep the
        # budget comparison honest. Switch to per-job started_at/completed_at
        # if a pure-execution figure is ever needed.
        run: |
          gh run list --workflow=ci.yml --limit 20 \
            --json conclusion,createdAt,updatedAt,databaseId \
            > runs.json
          python3 - <<'PY'
          import json, datetime, os, statistics
          runs = json.load(open("runs.json"))
          green = [r for r in runs if r["conclusion"] == "success"]
          durations = []
          for r in green:
              t0 = datetime.datetime.fromisoformat(r["createdAt"].replace("Z","+00:00"))
              t1 = datetime.datetime.fromisoformat(r["updatedAt"].replace("Z","+00:00"))
              durations.append((t1 - t0).total_seconds())
          out = os.environ.get("GITHUB_OUTPUT", os.devnull)
          if not durations:
              print("no green runs in window")
              # Empty window is valid, not over budget. Write a fallback
              # comment so the unconditional post step always has a file.
              with open("comment.md", "w") as f:
                  f.write("## CI turnaround (last 0 green)\n\n")
                  f.write("No green runs in the last-20 window; nothing to measure.\n")
              with open(out, "a") as g:
                  g.write("over_budget=false\n")
              raise SystemExit(0)
          p50 = statistics.median(durations)
          p99 = sorted(durations)[int(len(durations) * 0.99) - 1] if len(durations) >= 5 else max(durations)
          ok = p50 <= 120 and p99 <= 240
          status = "✅ within budget" if ok else "⚠️ over budget"
          print(f"## CI turnaround (last {len(durations)} green)\n")
          print(f"- p50: **{p50:.0f}s** (budget 120s)")
          print(f"- p99: **{p99:.0f}s** (budget 240s)\n")
          print(f"Status: {status}")
          with open("comment.md", "w") as f:
              f.write(f"## CI turnaround (last {len(durations)} green)\n\n")
              f.write(f"- p50: **{p50:.0f}s** (budget 120s)\n")
              f.write(f"- p99: **{p99:.0f}s** (budget 240s)\n\n")
              f.write(f"Status: {status}\n")
              f.write("\n_Turnaround = updatedAt-createdAt (includes queue wait)._\n")
          with open(out, "a") as g:
              g.write(f"over_budget={'false' if ok else 'true'}\n")
          PY
      - name: post PR comment
        # always() so the comment still posts when the budget step flags
        # over-budget (the gating happens in the next step, after the post).
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: enforce budget
        # Gate: fail the job when CI turnaround exceeded the p50/p99 budget,
        # but only after the comment above has been posted.
        if: ${{ always() && steps.budget.outputs.over_budget == 'true' }}
        run: |
          echo "CI turnaround over budget (p50>120s or p99>240s)" >&2
          exit 1
