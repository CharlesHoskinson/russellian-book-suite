name: ci-budget
on:
  pull_request:
    types: [labeled, opened, synchronize]
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly trend
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  budget-check:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-budget') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: compute last-20 execution wall-time stats
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # P2-ci-budget-and-onboarding-value: the metric is now derived from the
        # per-run start field (`startedAt`, the run-list projection of the API's
        # run_started_at), so it is real execution wall-time with queue/concurrency
        # wait EXCLUDED — not the old updatedAt-createdAt turnaround figure. The
        # check is ADVISORY: it reports p50/p99 wall-time as a trend and never
        # fails the job, because a single slow/queued run should not red a PR.
        run: |
          gh run list --workflow=ci.yml --limit 20 \
            --json conclusion,startedAt,updatedAt,databaseId \
            > runs.json
          python3 - <<'PY'
          import json, datetime, statistics
          runs = json.load(open("runs.json"))
          green = [r for r in runs if r["conclusion"] == "success"]
          durations = []
          for r in green:
              # startedAt == run_started_at (execution start, queue excluded);
              # updatedAt == completion. Difference is execution wall-time.
              s = r.get("startedAt")
              u = r.get("updatedAt")
              if not s or not u:
                  continue
              t0 = datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))
              t1 = datetime.datetime.fromisoformat(u.replace("Z", "+00:00"))
              durations.append((t1 - t0).total_seconds())
          if not durations:
              print("no green runs in window")
              with open("comment.md", "w") as f:
                  f.write("## CI wall-time (last 0 green) — advisory\n\n")
                  f.write("No green runs with timing in the last-20 window; nothing to measure.\n")
              raise SystemExit(0)
          p50 = statistics.median(durations)
          p99 = sorted(durations)[int(len(durations) * 0.99) - 1] if len(durations) >= 5 else max(durations)
          ok = p50 <= 120 and p99 <= 240
          status = "within budget" if ok else "over budget (advisory)"
          report = (
              f"## CI wall-time (last {len(durations)} green) — advisory\n\n"
              f"- p50: **{p50:.0f}s** (target 120s)\n"
              f"- p99: **{p99:.0f}s** (target 240s)\n\n"
              f"Status: {status}\n"
              "\n_Wall-time = startedAt..updatedAt (execution only, queue wait excluded). "
              "Advisory trend — does not gate the PR._\n"
          )
          print(report)
          with open("comment.md", "w") as f:
              f.write(report)
          PY
      - name: post PR comment (advisory)
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish trend to step summary
        if: always()
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"
