name: ci-legacy

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-legacy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-workflow:
    name: lint workflow yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install actionlint (pinned tarball + SHA verification)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Download the tarball under its real filename so sha256sum -c can find it.
          curl -fsSL "${BASE}/${TARBALL}" -o "${TARBALL}"
          curl -fsSL "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep "${TARBALL}" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" actionlint
          mv actionlint /usr/local/bin/
      - name: run actionlint
        run: actionlint -color

  test-book-qa:
    name: test book-qa (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/book-qa
      - name: pytest
        working-directory: skills/book-qa
        run: python -m pytest tests/ -v

  test-book-thesis:
    name: test book-thesis (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/book-thesis
      - name: pytest
        working-directory: skills/book-thesis
        run: python -m pytest tests/ -v

  test-book-knowledge:
    name: test book-knowledge (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/book-knowledge
      - name: pytest
        working-directory: skills/book-knowledge
        run: python -m pytest tests/ -v

  test-book-compose:
    name: test book-compose (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/book-compose
        # en_core_web_sm not installed; conftest skip-gate skips spacy-dependent tests.
        # For full local coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
      - name: symlink sibling skills (book-knowledge, russellian-style, book-review, review-conductor)
        # book-compose's sibling-skills.py looks under ~/.claude/skills/<sibling>/.
        # Symlink each sibling so the tests can locate them.
        run: |
          mkdir -p "$HOME/.claude/skills"
          for sibling in book-knowledge russellian-style book-review review-conductor; do
            ln -sfn "$PWD/skills/$sibling" "$HOME/.claude/skills/$sibling"
          done
      - name: pytest (deselect sibling-venv test; CI siblings have no .venv)
        working-directory: skills/book-compose
        run: python -m pytest tests/ -v --deselect tests/test_sibling_skills.py::test_sibling_python_uses_skill_venv

  test-book-review:
    name: test book-review (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/book-review
      - name: pytest
        working-directory: skills/book-review
        run: python -m pytest tests/ -v

  test-russellian-style:
    name: test russellian-style (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/russellian-style
        # en_core_web_sm not installed; conftest skip-gate skips 86+11 linter tests.
        # For full local coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
      - name: pytest
        working-directory: skills/russellian-style
        run: python -m pytest tests/ -v

  test-review-conductor:
    name: test review-conductor (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/review-conductor
      - name: pytest
        working-directory: skills/review-conductor
        run: python -m pytest tests/ -v

  test-neurosym-forge:
    name: test neurosym-forge offline (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: ${{ matrix.python }}
          skill-path: skills/neurosym-forge
          extra: dev
      - name: pytest (offline, excludes cljs integration)
        working-directory: skills/neurosym-forge
        run: python -m pytest tests/ --ignore=tests/test_cljs_integration.py -v

  smoke-bermuda-pipeline:
    name: smoke (Bermuda end-to-end)
    runs-on: ubuntu-latest
    needs: [test-book-qa, test-book-thesis]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: "3.13"
          skill-path: skills/book-thesis
      - name: compile_thesis
        run: |
          python skills/book-thesis/scripts/compile_thesis.py examples/bermuda-manual bermuda-manual
      - name: datalog_consistency
        run: |
          python skills/book-thesis/scripts/datalog_consistency.py examples/bermuda-manual
      - name: upload qa reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bermuda-qa-reports
          path: |
            examples/bermuda-manual/qa/defects.json
            examples/bermuda-manual/qa/supports-defects.json
            examples/bermuda-manual/qa/datalog-defects.json
          if-no-files-found: warn

  bermuda-informational:
    # Informational lint steps that are known to emit v6-era orphan defects.
    # Allowed to fail; regressions are visible in artifact uploads but do not
    # gate the branch.
    name: bermuda informational lints
    runs-on: ubuntu-latest
    needs: [smoke-bermuda-pipeline]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/book-thesis/pyproject.toml
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/book-thesis[ci] -e skills/book-qa[ci]
      - name: compile_thesis (prerequisite for lint_supports)
        run: |
          python skills/book-thesis/scripts/compile_thesis.py examples/bermuda-manual bermuda-manual
      - name: lint_supports (informational)
        continue-on-error: true
        run: |
          python skills/book-thesis/scripts/lint_supports.py examples/bermuda-manual 3.0.0
      - name: lint_artifact (informational, expects v6 orphans)
        continue-on-error: true
        run: |
          python skills/book-qa/scripts/lint_artifact.py examples/bermuda-manual 3.0.0
      - name: upload informational reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bermuda-informational-reports
          path: |
            examples/bermuda-manual/qa/defects.json
            examples/bermuda-manual/qa/supports-defects.json
          if-no-files-found: warn

  cljs-bermuda-test:
    name: cljs-bermuda-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: verifiers/bermuda/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: npm install (lockfile-respecting)
        working-directory: verifiers/bermuda
        # `npm install` instead of `npm ci` — bermuda's lockfile sometimes
        # drifts from package.json across PRs in flight, and `npm ci` is
        # strict-fail there. The lockfile-cache key still keys on it.
        run: npm install --no-audit --no-fund
      - name: shadow-cljs compile + node test
        working-directory: verifiers/bermuda
        run: |
          npx shadow-cljs compile test
          node cljs-orchestrator/dist/test.js

  bermuda-z3-build:
    name: bermuda verifier z3 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifiers/bermuda/rust-verifier
      - name: cargo build --features smt
        working-directory: verifiers/bermuda/rust-verifier
        run: cargo build --features smt

  bermuda-z3-verify:
    name: bermuda end-to-end verify (real Z3)
    runs-on: ubuntu-latest
    needs: [bermuda-z3-build]
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifiers/bermuda/rust-verifier
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest edn-format
      - name: install node deps
        working-directory: verifiers/bermuda
        run: npm install
      - name: booklogic compile
        working-directory: verifiers/bermuda
        run: npm run booklogic-compile
      - name: codegen axioms
        working-directory: verifiers/bermuda
        run: python -m scripts.codegen_axioms --project-root .
        env:
          PYTHONPATH: ../../skills/neurosym-forge
      - name: build rust verifier
        # `cargo build --features smt,kg` produces the .so for the rust-verifier
        # crate. The D13 smoke below runs run_verification with --stub, so the
        # shadow-cljs+napi+.node chain is not needed here; if/when sprint 5+
        # drops --stub, restore the napi+shadow-cljs steps (see git history).
        working-directory: verifiers/bermuda/rust-verifier
        run: cargo build --release --features smt,kg
      - name: run verifier end-to-end
        working-directory: verifiers/bermuda
        run: |
          python -m scripts.run_verification \
            --workspace ../../examples/bermuda-manual \
            --release 6.0.0 --stub || true
        env:
          PYTHONPATH: ../../skills/neurosym-forge
      - name: run book-qa D13 lint
        continue-on-error: true
        run: |
          python skills/book-qa/scripts/lint_artifact.py examples/bermuda-manual 6.0.0 || true
      - name: assert D13 ticket appears (advisory — needs non-stub real-Z3 run)
        # Currently advisory: the run_verification --stub above doesn't trigger
        # D13 tickets; the real end-to-end D13 fire needs the napi .node +
        # shadow-cljs orchestrator chain which is a follow-up. Sprint 4 ships
        # the Bermuda migration; D13-via-real-Z3 lands in a follow-up sprint.
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          defects = Path("examples/bermuda-manual/qa/defects.json")
          if not defects.exists():
              print(f"{defects} missing — book-qa did not run")
              sys.exit(0)
          payload = json.loads(defects.read_text(encoding="utf-8"))
          # lint_artifact emits {"summary": ..., "defects": [...]} — list lives under "defects"
          defect_list = payload.get("defects", []) if isinstance(payload, dict) else payload
          d13 = [d for d in defect_list if isinstance(d, dict) and d.get("class") == "D13"]
          print(f"D13 tickets found: {len(d13)}")
          PY
      - name: upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bermuda-verify-artifacts
          path: |
            examples/bermuda-manual/qa/verification-defects.json
            examples/bermuda-manual/qa/defects.json
            verifiers/bermuda/work/verdict.edn
          if-no-files-found: warn

  osmotic-pressure-smoke:
    name: smoke (osmotic-pressure verifier)
    runs-on: ubuntu-latest
    needs: [test-book-qa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifiers/osmotic_pressure/rust-verifier
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: install nbb
        run: npm install -g nbb
      - name: install z3 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: confirm scaffold present in tree
        run: |
          test -d verifiers/osmotic_pressure || (echo "scaffold missing"; exit 1)
          test -f verifiers/osmotic_pressure/rules/booklogic/constraints.edn \
            || (echo "constraints.edn missing"; exit 1)
      - name: install project npm deps
        working-directory: verifiers/osmotic_pressure
        run: npm install
      - name: compile booklogic source
        working-directory: verifiers/osmotic_pressure
        run: nbb -m osmotic-pressure.booklogic .
      - name: regenerate axioms.rs from constraints.edn
        working-directory: verifiers/osmotic_pressure
        run: |
          python -m pip install --quiet edn-format || true
          python scripts/codegen_axioms.py
        env:
          PYTHONPATH: ../../skills/neurosym-forge
      - name: build rust verifier (smt feature)
        working-directory: verifiers/osmotic_pressure/rust-verifier
        run: cargo build --features smt
      - name: build cljs verifier bundle
        working-directory: verifiers/osmotic_pressure
        run: npm run build
      - name: pytest smoke (sat + unsat verdicts)
        run: |
          python -m pytest verifiers/osmotic_pressure/tests/ -v
        env:
          PYTHONPATH: skills/neurosym-forge
      - name: upload verdict artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osmotic-pressure-verdicts
          path: |
            verifiers/osmotic_pressure/work/verdict.edn
          if-no-files-found: warn
