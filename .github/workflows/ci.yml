name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # for the ci-budget job to comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Python-only skills don't need Nix — they run under standard setup-python.
  # The setup-book-python composite action handles pip + venv per skill; the
  # matrix.include lines override `extra` and add sibling-skill symlinks /
  # pytest deselect arguments where individual skills need them.
  python-skill-matrix:
    name: python-skill (${{ matrix.skill }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill:
          - book-qa
          - book-thesis
          - book-knowledge
          - book-review
          - russellian-style
          - review-conductor
        include:
          # book-compose needs sibling skills symlinked under ~/.claude/skills/
          - skill: book-compose
            siblings: book-knowledge russellian-style book-review review-conductor
            pytest-deselect: "--deselect tests/test_sibling_skills.py::test_sibling_python_uses_skill_venv"
          # neurosym-forge only ships a [dev] extras section, not [ci]
          - skill: neurosym-forge
            extra: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-book-python
        with:
          python-version: "3.13"
          skill-path: skills/${{ matrix.skill }}
          extra: ${{ matrix.extra || 'ci' }}
      - name: symlink siblings
        if: matrix.siblings != ''
        run: |
          mkdir -p "$HOME/.claude/skills"
          for sibling in ${{ matrix.siblings }}; do
            ln -sfn "$PWD/skills/$sibling" "$HOME/.claude/skills/$sibling"
          done
      - name: pytest
        working-directory: skills/${{ matrix.skill }}
        run: python -m pytest tests/ -v ${{ matrix.pytest-deselect }}

  # Nix-using jobs are chained via `needs:` to serialize magic-nix-cache
  # writes. Parallelizing all of them at once gets the cache rate-limited
  # by GitHub Actions Cache and every downstream job loses its substituter.
  # We accept slightly longer wall-time in exchange for reliability.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop -c make lint

  scaffold-bake:
    name: scaffold-bake
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            verifiers/bermuda/rust-verifier
            verifiers/osmotic_pressure/rust-verifier
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make scaffold-bake

  regression:
    name: regression (sprint-5)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/bermuda/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make regression

  verifier-bermuda:
    name: verifier (bermuda)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/bermuda/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make smoke-bermuda

  verifier-osmotic:
    name: verifier (osmotic-pressure)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/osmotic_pressure/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make smoke-osmotic

  required:
    name: ci required ✓
    needs:
      - lint
      - scaffold-bake
      - regression
      - verifier-bermuda
      - verifier-osmotic
      - python-skill-matrix
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] ||
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
