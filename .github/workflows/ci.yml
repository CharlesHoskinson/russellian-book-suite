name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-workflow:
    name: lint workflow yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv actionlint /usr/local/bin/
      - name: run actionlint
        run: actionlint -color

  test-book-qa:
    name: test book-qa (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install pyyaml + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: pytest
        working-directory: skills/book-qa
        run: python -m pytest tests/ -v

  test-book-thesis:
    name: test book-thesis (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install pyyaml + rdflib + pyDatalog + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml rdflib pyDatalog pytest
      - name: pytest
        working-directory: skills/book-thesis
        run: python -m pytest tests/ -v

  smoke-bermuda-pipeline:
    name: smoke (Bermuda end-to-end)
    runs-on: ubuntu-latest
    needs: [test-book-qa, test-book-thesis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml rdflib pyDatalog
      - name: compile_thesis
        run: |
          python skills/book-thesis/scripts/compile_thesis.py examples/bermuda-manual bermuda-manual
      - name: lint_supports
        run: |
          python skills/book-thesis/scripts/lint_supports.py examples/bermuda-manual 3.0.0 || true
      - name: datalog_consistency
        run: |
          python skills/book-thesis/scripts/datalog_consistency.py examples/bermuda-manual
      - name: book-qa lint_artifact (informational, expects v6 orphans)
        run: |
          python skills/book-qa/scripts/lint_artifact.py examples/bermuda-manual 3.0.0 || true
      - name: upload qa reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bermuda-qa-reports
          path: |
            examples/bermuda-manual/qa/defects.json
            examples/bermuda-manual/qa/supports-defects.json
            examples/bermuda-manual/qa/datalog-defects.json
          if-no-files-found: warn

  cljs-bermuda-test:
    name: cljs-bermuda-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: npm install
        working-directory: verifiers/bermuda
        run: npm install
      - name: shadow-cljs compile + node test
        working-directory: verifiers/bermuda
        run: |
          npx shadow-cljs compile test
          node cljs-orchestrator/dist/test.js

  bermuda-z3-build:
    name: bermuda verifier z3 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifiers/bermuda/rust-verifier
      - name: cargo build --features smt
        working-directory: verifiers/bermuda/rust-verifier
        run: cargo build --features smt

  bermuda-z3-verify:
    name: bermuda end-to-end verify (real Z3)
    runs-on: ubuntu-latest
    needs: [bermuda-z3-build]
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifiers/bermuda/rust-verifier
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest edn-format
      - name: install node deps
        working-directory: verifiers/bermuda
        run: npm install
      - name: booklogic compile
        working-directory: verifiers/bermuda
        run: npm run booklogic-compile
      - name: codegen axioms
        working-directory: verifiers/bermuda
        run: python -m scripts.codegen_axioms --project-root .
        env:
          PYTHONPATH: ../../skills/neurosym-forge
      - name: build rust verifier
        # `cargo build --features smt,kg` produces the .so for the rust-verifier
        # crate. The D13 smoke below runs run_verification with --stub, so the
        # shadow-cljs+napi+.node chain is not needed here; if/when sprint 5+
        # drops --stub, restore the napi+shadow-cljs steps (see git history).
        working-directory: verifiers/bermuda/rust-verifier
        run: cargo build --release --features smt,kg
      - name: run verifier end-to-end
        working-directory: verifiers/bermuda
        run: |
          python -m scripts.run_verification \
            --workspace ../../examples/bermuda-manual \
            --release 6.0.0 --stub || true
        env:
          PYTHONPATH: ../../skills/neurosym-forge
      - name: run book-qa D13 lint
        run: |
          python skills/book-qa/scripts/lint_artifact.py examples/bermuda-manual 6.0.0 || true
      - name: assert D13 ticket appears
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          defects = Path("examples/bermuda-manual/qa/defects.json")
          assert defects.exists(), f"{defects} missing — book-qa did not run"
          payload = json.loads(defects.read_text(encoding="utf-8"))
          d13 = [d for d in payload if d.get("class_") == "D13"]
          if not d13:
              sys.stderr.write(f"D13 tickets expected; got payload={payload!r}\n")
              sys.exit(1)
          print(f"OK: {len(d13)} D13 ticket(s) emitted")
          PY
      - name: upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bermuda-verify-artifacts
          path: |
            examples/bermuda-manual/qa/verification-defects.json
            examples/bermuda-manual/qa/defects.json
            verifiers/bermuda/work/verdict.edn
          if-no-files-found: warn
