name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-workflow:
    name: lint workflow yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv actionlint /usr/local/bin/
      - name: run actionlint
        run: actionlint -color

  test-book-qa:
    name: test book-qa (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install pyyaml + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: pytest
        working-directory: skills/book-qa
        run: python -m pytest tests/ -v

  smoke-lint-bermuda:
    name: smoke lint (Bermuda example)
    runs-on: ubuntu-latest
    needs: test-book-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install pyyaml
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: run book-qa.lint_artifact
        run: |
          python skills/book-qa/scripts/lint_artifact.py examples/bermuda-manual 3.0.0
      - name: upload defects.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bermuda-defects-report
          path: examples/bermuda-manual/qa/defects.json
          if-no-files-found: warn
