name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-workflow:
    name: lint workflow yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv actionlint /usr/local/bin/
      - name: run actionlint
        run: actionlint -color

  test-book-qa:
    name: test book-qa (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/book-qa/pyproject.toml
      - name: install book-qa[ci]
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/book-qa[ci]
      - name: pytest
        working-directory: skills/book-qa
        run: python -m pytest tests/ -v

  test-book-thesis:
    name: test book-thesis (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/book-thesis/pyproject.toml
      - name: install book-thesis[ci]
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/book-thesis[ci]
      - name: pytest
        working-directory: skills/book-thesis
        run: python -m pytest tests/ -v

  test-book-knowledge:
    name: test book-knowledge (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/book-knowledge/pyproject.toml
      - name: install book-knowledge[ci]
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/book-knowledge[ci]
      - name: pytest
        working-directory: skills/book-knowledge
        run: python -m pytest tests/ -v

  test-book-compose:
    name: test book-compose (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/book-compose/pyproject.toml
      - name: install book-compose[ci]
        # en_core_web_sm not installed; conftest skip-gate skips spacy-dependent tests.
        # For full local coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/book-compose[ci]
      - name: pytest
        working-directory: skills/book-compose
        run: python -m pytest tests/ -v

  test-book-review:
    name: test book-review (py${{ matrix.python }})
    runs-on: ubuntu-latest
