name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # for the ci-budget job to comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Python-only skills don't need Nix — pip + pytest in standard setup-python
  # runs faster and avoids magic-nix-cache rate-limiting when matrix fans out.
  python-skill-matrix:
    name: python-skill (${{ matrix.skill }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill:
          - book-qa
          - book-thesis
          - book-knowledge
          - book-compose
          - book-review
          - russellian-style
          - review-conductor
          - neurosym-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/${{ matrix.skill }}/pyproject.toml
      - name: install ${{ matrix.skill }}[ci]
        working-directory: skills/${{ matrix.skill }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]"
      - name: pytest
        working-directory: skills/${{ matrix.skill }}
        run: pytest -q

  # Nix-using jobs are chained via `needs:` to serialize magic-nix-cache
  # writes. Parallelizing all of them at once gets the cache rate-limited
  # by GitHub Actions Cache and every downstream job loses its substituter.
  # We accept slightly longer wall-time in exchange for reliability.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop -c make lint

  scaffold-bake:
    name: scaffold-bake
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            verifiers/bermuda/rust-verifier
            verifiers/osmotic_pressure/rust-verifier
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make scaffold-bake

  regression:
    name: regression (sprint-5)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/bermuda/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make regression

  verifier-bermuda:
    name: verifier (bermuda)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/bermuda/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make smoke-bermuda

  verifier-osmotic:
    name: verifier (osmotic-pressure)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: verifiers/osmotic_pressure/rust-verifier }
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: nix develop -c make smoke-osmotic

  required:
    name: ci required ✓
    needs:
      - lint
      - scaffold-bake
      - regression
      - verifier-bermuda
      - verifier-osmotic
      - python-skill-matrix
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] ||
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
