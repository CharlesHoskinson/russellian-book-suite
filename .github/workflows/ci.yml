    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/russellian-style/pyproject.toml
      - name: install russellian-style[ci]
        # en_core_web_sm not installed; conftest skip-gate skips 86+11 linter tests.
        # For full local coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/russellian-style[ci]
      - name: pytest
        working-directory: skills/russellian-style
        run: python -m pytest tests/ -v

  test-review-conductor:
    name: test review-conductor (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — run all matrix legs so we see all breakages at once
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
