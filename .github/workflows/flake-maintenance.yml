name: flake-maintenance
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Don't let a manual dispatch overlapping the weekly schedule open two
# competing flake.lock bump PRs.
concurrency:
  group: flake-maintenance
  cancel-in-progress: true

jobs:
  # Advisory: warns when flake.lock pins a nixpkgs that is stale (>30 days)
  # or off a supported branch. Does not fail the run.
  flake-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          fail-mode: false
          send-statistics: false

  # Opens/updates a flake.lock bump PR. NOTE: PRs created with the default
  # GITHUB_TOKEN do not trigger `pull_request` workflows — close/reopen the
  # PR (or push an empty commit) to get a CI run before merging.
  update-flake-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "build(nix): update flake.lock"
          pr-labels: dependencies
