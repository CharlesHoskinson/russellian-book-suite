name: onboarding-bench
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: run onboarding bench (stub backend)
        run: python skills/neurosym-forge/eval/onboarding-bench.py --backend stub
      - name: aggregate runs into report
        run: python skills/neurosym-forge/eval/aggregate_runs.py
      - name: upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onboarding-bench-report
          path: docs/eval/onboarding-bench-report.md
