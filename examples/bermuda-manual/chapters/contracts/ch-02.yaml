chapter_id: ch-02
title: History
purpose: Trace Bermuda's history from Spanish discovery through the 1609 Sea Venture wreck, plantation and shipbuilding eras, naval base years, and the move toward modern self-government.
audience: senior-engineer
chapter_type: synthesis
must_include:
  - Juan de Bermudez and the original sighting
  - the 1609 Sea Venture wreck
  - the 1612 settlement
  - slavery and emancipation
  - the Royal Naval Dockyard
  - the 1968 constitution and modern self-government
must_not_do:
  - speculate beyond verified claims
  - editorialize about colonialism beyond what sources support
evidence_requirements:
  minimum_verified_claims: 18
  max_unresolved_conflicts: 0
  required_sources: [history]
  evidence_density_target: 4
acceptance_tests:
  - hedge_count == 0
  - passive_voice_ratio < 0.10
  - modifier_budget_violations == 0
  - listicle_abstract_count == 0
  - rhythm_violations == 0
  - persona_critical_count == 0
  - persona_reviews_complete == True
style:
  inherit: russellian-style
  overrides: {}
output_formats: [markdown]
