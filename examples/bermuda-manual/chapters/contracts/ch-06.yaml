chapter_id: ch-06
title: Daily Life and Cost of Living
purpose: Quantify the practical costs of living in Bermuda - groceries, dining, utilities - so a prospective resident can plan a budget.
audience: developer
chapter_type: reference
must_include:
  - typical grocery prices with units
  - restaurant meal price ranges
  - utility costs
  - high-cost driver (import duties)
must_not_do:
  - quote prices without units or currency
  - speculate beyond verified claims
evidence_requirements:
  minimum_verified_claims: 12
  max_unresolved_conflicts: 0
  required_sources: [cost-of-living]
  evidence_density_target: 4
acceptance_tests:
  - hedge_count == 0
  - passive_voice_ratio < 0.10
  - modifier_budget_violations == 0
  - listicle_abstract_count == 0
  - rhythm_violations == 0
  - persona_critical_count == 0
  - persona_reviews_complete == True
style:
  inherit: russellian-style
  overrides: {}
output_formats: [markdown]
