chapter_id: ch-01
title: (set me)
purpose: One-sentence thesis. This is the axiomatic spine.
audience: senior-engineer
chapter_type: tutorial
must_include:
  - explicit topic 1
must_not_do:
  - speculate beyond verified claims
evidence_requirements:
  minimum_verified_claims: 8
  max_unresolved_conflicts: 0
  required_sources: []
  evidence_density_target: 5
acceptance_tests:
  # The russellian linters are candidate-detectors. hedge_count includes deontic
  # "may" / counterfactual "could" (permitted: the policy bans VAGUE hedging, not
  # exact uncertainty); passive_voice and modifier_budget flag legitimate analytic
  # voice and precise paired adjectives. So those three carry realistic budgets.
  # Anti-slop / correctness gates (ai_fingerprint, listicle, rhythm, citation,
  # unsupported_claim, shacl) stay strict. See pilot bug ledger (Stage 5).
  - shacl_conforms == true
  - unsupported_claim_count == 0
  - hedge_count <= 6
  - passive_voice_ratio < 0.15
  - modifier_budget_violations <= 10
  - citation_token_count == 0
  - ai_fingerprint_total == 0
  - listicle_abstract_count == 0
  - rhythm_violations == 0
  - footnote_orphan_count == 0
  - persona_critical_count == 0
  - persona_reviews_complete == True
style:
  inherit: russellian-style
  overrides: {}
output_formats: [markdown, pdf]
