[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-compose"
version = "0.1.0"
description = "Local-only chapter compiler for the book-compose Claude Code skill"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "rdflib>=7.0,<9.0",
    "pyshacl>=0.26,<1.0",
    "spacy>=3.7,<4.0",
    "playwright>=1.45,<2.0",
]

[project.optional-dependencies]
# ci extra intentionally omits spacy model (en_core_web_sm); conftest skip-gate
# handles missing model. For full coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
ci = [
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "rdflib>=7.0,<9.0",
    "pyshacl>=0.26,<1.0",
    "spacy>=3.7,<4.0",
    "pytest>=8.0,<9.0",
]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:rdflib.*",
    "ignore::DeprecationWarning:pyshacl.*",
]
