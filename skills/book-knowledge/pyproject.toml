[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-knowledge"
version = "0.1.0"
description = "Local-only epistemic compiler for the book-knowledge Claude Code skill"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "markdown-it-py>=3.0,<5.0",
    "rdflib>=7.0,<9.0",
    "pyshacl>=0.26,<1.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
ci = [
    "pdfplumber>=0.11,<1.0",
    "markdown-it-py>=3.0,<5.0",
    "rdflib>=7.0,<9.0",
    "pyshacl>=0.26,<1.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "pytest>=8.0,<9.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "reportlab>=4.0,<5.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:rdflib.*",
    "ignore::DeprecationWarning:pyshacl.*",
]
