<!DOCTYPE html>
<html>
<head>
<style>
/* Tailwind v3 preflight excerpt */
h1, h2, h3, h4, h5, h6 {
  font-size: inherit;
  font-weight: inherit;
}
/* Override block restores heading sizes in the cascade after the reset */
h1 { font-size: 2.25em; font-weight: 700; }
h2 { font-size: 1.5em; font-weight: 600; }
h3 { font-size: 1.25em; font-weight: 600; }
body { font-family: sans-serif; }
</style>
</head>
<body>
<h1>Chapter 1</h1>
<p>The override after the preflight reset restores readable headings.</p>
</body>
</html>
