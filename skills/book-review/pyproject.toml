[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-review"
version = "0.1.0"
description = "Persona-based editorial reviews for the russellian-book-forge family"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "spacy>=3.7,<4.0",
    "markdown-it-py>=3.0,<4.0",
]

[project.optional-dependencies]
ci = [
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "spacy>=3.7,<4.0",
    "markdown-it-py>=3.0,<4.0",
    "pytest>=8.0,<9.0",
]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
addopts = "-v"
