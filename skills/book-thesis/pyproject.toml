[project]
name = "book-thesis"
version = "0.1.0"
description = "Metabook reasoning layer: thesis spine + entailment loop + Datalog consistency"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7.0",
    "pyDatalog>=0.17,<1.0",
    "rdflib>=7.0,<9.0",
]

[project.optional-dependencies]
ci = [
    "pyyaml>=6.0,<7.0",
    "rdflib>=7.0,<9.0",
    "pyDatalog>=0.17,<1.0",
    "pytest>=8.0,<9.0",
]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:rdflib.*",
    "ignore::DeprecationWarning:pyDatalog.*",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
