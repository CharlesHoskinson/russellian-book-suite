[project]
name = "book-thesis"
version = "0.1.0"
description = "Metabook reasoning layer: thesis spine + entailment loop + Datalog consistency"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "pyDatalog>=0.17",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
