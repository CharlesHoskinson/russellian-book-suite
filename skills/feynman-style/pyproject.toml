[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman-style"
version = "0.1.0"
description = "Feynman-voice second-pass linters for the feynman-style Claude Code skill"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7,<4.0",
]

[project.optional-dependencies]
ci = ["spacy>=3.7,<4.0", "pyyaml>=6.0,<7.0", "jsonschema>=4.21,<5.0", "pytest>=8.0,<9.0"]
dev = ["pytest>=8.0,<9.0", "pyyaml>=6.0,<7.0", "jsonschema>=4.21,<5.0", "pdfplumber>=0.11,<0.12"]  # pdfplumber: offline corpus profile builder (build_delta_profile.py)

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
addopts = "-v"
