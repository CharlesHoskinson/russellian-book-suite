[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iacr-review"
version = "0.1.0"
description = "EC22-grounded IACR/EUROCRYPT review rubric with 10 expert-persona dispatch and consolidation ledger"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ci = [
    "pytest>=8.0,<9.0",
]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
