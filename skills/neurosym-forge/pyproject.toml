[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosym-forge"
version = "0.1.0"
description = "Scaffolder for ClojureScript + Rust neurosymbolic verification projects"
authors = [{name = "Charles Hoskinson"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21,<5.0",
    "pyyaml>=6.0.1,<7.0",
    "jinja2>=3.1.3,<4.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.1,<8.0",
    "psutil>=5.9,<8.0",
    "z3-solver>=4.12,<5.0",
    # numpy is also required by [semantic]; listed here so a fresh
    # `pip install -e .[dev]` makes the full test suite runnable
    # without needing the [semantic] sentence-transformers stack too.
    "numpy>=1.26,<3.0",
    "pytest-xdist>=3.5,<4.0",
]
semantic = [
    "sentence-transformers>=2.7,<6.0",
    "numpy>=1.26,<3.0",
]
# REQ-LLMLIFT-040, 041: optional LLM provider SDKs. The framework
# operates fully offline with the StubLift provider; install these
# extras only when wiring `:backend :llm` lifts to real providers.
llm-openai = ["openai>=1.0,<3.0"]
llm-anthropic = ["anthropic>=0.30,<1.0"]
llm-all = ["openai>=1.0,<3.0", "anthropic>=0.30,<1.0"]

[project.scripts]
forge = "scripts.forge_cli:main"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["../assets/**/*", "../references/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
