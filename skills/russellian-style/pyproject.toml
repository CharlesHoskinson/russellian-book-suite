[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "russellian-style"
version = "0.1.0"
description = "Russell-style linters for the russellian-style Claude Code skill"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7,<4.0",
]

[project.optional-dependencies]
# ci extra intentionally omits spacy model (en_core_web_sm); conftest skip-gate
# handles missing model. For full coverage: pip install -e .[ci] && python -m spacy download en_core_web_sm
ci = [
    "spacy>=3.7,<4.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "pytest>=8.0,<10.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_canary: test exercises platform-sensitive behaviour and must run on Windows",
]
addopts = "-v"
