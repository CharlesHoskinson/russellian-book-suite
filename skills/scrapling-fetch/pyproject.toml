[project]
name = "scrapling-fetch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "scrapling==0.4.14",
  "jsonschema>=4.26.0,<5",
  "trafilatura>=2.2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"
